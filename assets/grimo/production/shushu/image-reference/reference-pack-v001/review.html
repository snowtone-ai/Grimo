<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shushu Reference Pack v001</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f5f5;color:#3e2933;font-family:system-ui,sans-serif}main{max-width:1500px;margin:auto;padding:28px}h1{font-size:26px;margin-bottom:8px}p{color:#6e5660;line-height:1.7}h2{font-size:20px;margin-top:36px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.card{font:inherit;color:inherit;text-align:left;border:1px solid #e7d8de;border-radius:14px;background:white;padding:10px;cursor:zoom-in}.card img{width:100%;height:290px;object-fit:contain;background:#eee;border-radius:8px}.card span,.card small{display:block;margin:10px 5px}.card small{font-size:12px;color:#806772}dialog{padding:16px;border:0;border-radius:12px;max-width:95vw;max-height:96vh}dialog::backdrop{background:#20171ddd}dialog img{max-width:90vw;max-height:82vh;object-fit:contain;display:block;margin:auto}.bar{display:flex;justify-content:space-between;gap:20px;padding-bottom:12px}.bar button{font:inherit;cursor:pointer}</style><main><h1>Shushu — Reference Pack v001</h1><p>2026-10-12 · 17枚 · 画像をクリックすると原寸で拡大できます。<br>Stage A の3枚は人間レビュー合格。追加14枚はAI選定済み・人間レビュー待ち。すべての生成で正本5枚を直接入力。</p><h2>Stage A — アンカー</h2><div class="grid"><button class="card" data-src="anchors/01-standing-neutral-front.png" data-label="01 正面全身・ニュートラル"><img src="anchors/01-standing-neutral-front.png" alt="正面全身・ニュートラル" loading="lazy"><span>01 正面全身・ニュートラル</span><small>Human合格</small></button><button class="card" data-src="anchors/02-face-neutral-closeup.png" data-label="02 顔アップ・ニュートラル"><img src="anchors/02-face-neutral-closeup.png" alt="顔アップ・ニュートラル" loading="lazy"><span>02 顔アップ・ニュートラル</span><small>Human合格</small></button><button class="card" data-src="anchors/03-standing-neutral-three-quarter.png" data-label="03 全身・3/4"><img src="anchors/03-standing-neutral-three-quarter.png" alt="全身・3/4" loading="lazy"><span>03 全身・3/4</span><small>Human合格</small></button></div><h2>Stage B — 表情</h2><div class="grid"><button class="card" data-src="expressions/04-half-blink.png" data-label="04 半目"><img src="expressions/04-half-blink.png" alt="半目" loading="lazy"><span>04 半目</span><small>今回追加・レビュー待ち</small></button><button class="card" data-src="expressions/05-full-blink.png" data-label="05 完全な閉眼"><img src="expressions/05-full-blink.png" alt="完全な閉眼" loading="lazy"><span>05 完全な閉眼</span><small>今回追加・レビュー待ち</small></button><button class="card" data-src="expressions/06-small-mouth-open.png" data-label="06 小さな開口"><img src="expressions/06-small-mouth-open.png" alt="小さな開口" loading="lazy"><span>06 小さな開口</span><small>今回追加・レビュー待ち</small></button><button class="card" data-src="expressions/07-closed-eye-smile.png" data-label="07 閉眼笑顔"><img src="expressions/07-closed-eye-smile.png" alt="閉眼笑顔" loading="lazy"><span>07 閉眼笑顔</span><small>今回追加・レビュー待ち</small></button><button class="card" data-src="expressions/08-tiny-surprise.png" data-label="08 小さな驚き"><img src="expressions/08-tiny-surprise.png" alt="小さな驚き" loading="lazy"><span>08 小さな驚き</span><small>今回追加・レビュー待ち</small></button></div><h2>Stage C — ポーズ・変形</h2><div class="grid"><button class="card" data-src="poses/09-low-rest-front.png" data-label="09 低い休息・正面"><img src="poses/09-low-rest-front.png" alt="低い休息・正面" loading="lazy"><span>09 低い休息・正面</span><small>今回追加・レビュー待ち</small></button><button class="card" data-src="poses/10-low-rest-side.png" data-label="10 低い休息・側面"><img src="poses/10-low-rest-side.png" alt="低い休息・側面" loading="lazy"><span>10 低い休息・側面</span><small>今回追加・レビュー待ち</small></button><button class="card" data-src="poses/11-one-paw-offer-three-quarter.png" data-label="11 片手差し出し・3/4"><img src="poses/11-one-paw-offer-three-quarter.png" alt="片手差し出し・3/4" loading="lazy"><span>11 片手差し出し・3/4</span><small>今回追加・レビュー待ち</small></button><button class="card" data-src="poses/12-two-paw-hold-front.png" data-label="12 両手保持・正面"><img src="poses/12-two-paw-hold-front.png" alt="両手保持・正面" loading="lazy"><span>12 両手保持・正面</span><small>今回追加・レビュー待ち</small></button><button class="card" data-src="poses/13-head-tilt-three-quarter.png" data-label="13 首かしげ・3/4"><img src="poses/13-head-tilt-three-quarter.png" alt="首かしげ・3/4" loading="lazy"><span>13 首かしげ・3/4</span><small>今回追加・レビュー待ち</small></button><button class="card" data-src="poses/14-cheek-pressure-front.png" data-label="14 頬の局所圧縮・正面"><img src="poses/14-cheek-pressure-front.png" alt="頬の局所圧縮・正面" loading="lazy"><span>14 頬の局所圧縮・正面</span><small>今回追加・レビュー待ち</small></button></div><h2>Stage D — 追加参照</h2><div class="grid"><button class="card" data-src="extended/15-self-groom-three-quarter.png" data-label="15 セルフグルーミング・3/4"><img src="extended/15-self-groom-three-quarter.png" alt="セルフグルーミング・3/4" loading="lazy"><span>15 セルフグルーミング・3/4</span><small>今回追加・レビュー待ち</small></button><button class="card" data-src="extended/16-food-anticipation-three-quarter.png" data-label="16 食べ物への期待・3/4"><img src="extended/16-food-anticipation-three-quarter.png" alt="食べ物への期待・3/4" loading="lazy"><span>16 食べ物への期待・3/4</span><small>今回追加・レビュー待ち</small></button></div><h2>追加 — 座位参照</h2><div class="grid"><button class="card" data-src="additional/17-seated-neutral-front.png" data-label="17 座位・正面ニュートラル"><img src="additional/17-seated-neutral-front.png" alt="座位・正面ニュートラル" loading="lazy"><span>17 座位・正面ニュートラル</span><small>今回追加・レビュー待ち</small></button></div><p>低い休息の沈み込み量・首かしげ角度・接触深度は見た目の目標です。画像自体は3Dの可動域やリグの成立を証明しません。食べ物の小さな粒は給餌位置の目印です。</p></main><dialog id="viewer"><div class="bar"><strong id="caption"></strong><button id="close">閉じる</button></div><img id="large" alt=""></dialog><script>const viewer=document.getElementById('viewer');document.querySelectorAll('.card').forEach(card=>card.addEventListener('click',()=>{document.getElementById('large').src=card.dataset.src;document.getElementById('large').alt=card.dataset.label;document.getElementById('caption').textContent=card.dataset.label;viewer.showModal()}));document.getElementById('close').addEventListener('click',()=>viewer.close());viewer.addEventListener('click',event=>{if(event.target===viewer)viewer.close()});</script></html>
