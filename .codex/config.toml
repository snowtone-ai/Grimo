# Repository-scoped Codex policy. The key is supported by `codex features list`.
[features]
multi_agent = false

# This documentation/tool-routing task needs only built-in shell, filesystem,
# and Git. These exact servers were present in the inspected Codex inventory;
# keep them installed globally but disabled for this repository.
[mcp_servers.blender]
enabled = false

[mcp_servers.chrome-devtools]
enabled = false

[mcp_servers.codegraph]
enabled = false

[mcp_servers.google-workspace]
enabled = false

[mcp_servers.playcanvas]
enabled = false

[mcp_servers.storybook]
enabled = false
