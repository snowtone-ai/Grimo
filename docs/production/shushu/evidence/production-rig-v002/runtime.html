<script type="module">
import * as pc from '/node_modules/playcanvas/build/playcanvas.mjs';

app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);app.setCanvasResolution(pc.RESOLUTION_AUTO);app.resizeCanvas();window.addEventListener('resize',()=>app.resizeCanvas());

const floor=new pc.Entity('SupportFloor');floor.addComponent('render',{type:'plane'});floor.setLocalScale(4,1,4);floor.setLocalPosition(0,-.002,0);const material=new pc.StandardMaterial();material.useMetalness=true;material.metalness=0;material.diffuse=new pc.Color(.68,.65,.67);material.update();floor.render.meshInstances[0].material=material;app.root.addChild(floor);

 window.qa={app,root,camera,res,sample,summary:()=>({engine:pc.version,clipNames:res.animations.map(a=>a.name),duration:res.animations[0].resource.duration,meshCount:meshes.length,skinMeshes:meshes.filter(m=>m.skinInstance).length,jointNames:bones.map(b=>b.name),anchors:anchors.map(a=>a.name),vertexFormats:meshes.map(m=>({node:m.node.name,elements:m.mesh.vertexBuffer.format.elements.map(e=>({semantic:e.name,components:e.numComponents}))})),textures:meshes.map(m=>({node:m.node.name,material:m.material.name,diffuseMap:!!m.material.diffuseMap,dimensions:m.material.diffuseMap?[m.material.diffuseMap.width,m.material.diffuseMap.height]:null})),graphics:app.graphicsDevice.deviceType})};

 };
 document.getElementById('info').textContent='v002 proof / Human PENDING / product & smartphone HOLD';root.anim.speed=0;sample(0);window.qaReady=true;
});
